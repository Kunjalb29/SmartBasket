version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbasket-db
    environment:
      POSTGRES_DB: smartbasket
      POSTGRES_USER: ${DB_USER:-smartbasket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartbasket_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbasket"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbasket-network

  redis:
    image: redis:7-alpine
    container_name: smartbasket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartbasket-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbasket-api
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=smartbasket
      - DB_USER=${DB_USER:-smartbasket}
      - DB_PASSWORD=${DB_PASSWORD:-smartbasket_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRY=86400000
      - CORS_ORIGINS=http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - smartbasket-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbasket-web
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartbasket-network

  nginx:
    image: nginx:alpine
    container_name: smartbasket-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - smartbasket-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  smartbasket-network:
    driver: bridge
