# =============================================
# SmartBasket API - Application Configuration
# =============================================

spring:
  application:
    name: smartbasket-api

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartbasket}
    username: ${DB_USER:smartbasket}
    password: ${DB_PASSWORD:smartbasket_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis Cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # Jackson JSON
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# Server
server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain

# JWT
jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars}
  expiry: ${JWT_EXPIRY:86400000}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:604800000}

# CORS
cors:
  origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.smartbasket: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui
    operations-sorter: alpha

# Custom SmartBasket properties
smartbasket:
  ai:
    enabled: true
    model: gpt-4o-mini
    max-tokens: 500
  delivery:
    free-threshold: 50.00
    fee: 5.99
  tax:
    rate: 0.08
